let GZOOM=1; try{const v=+localStorage.getItem('gzoom');if(v>=.4&&v<=1.6)GZOOM=v}catch(e){}
function bindGZoom(w){if(!w)return;const tb=w.querySelector('table.grid');if(!tb)return;let st=null;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  const setZ=(z,cx,cy)=>{z=Math.min(1.6,Math.max(.4,Math.round(z*100)/100));const r=w.getBoundingClientRect(),ox=(cx-r.left+w.scrollLeft)/GZOOM,oy=(cy-r.top+w.scrollTop)/GZOOM;GZOOM=z;tb.style.zoom=z;w.scrollLeft=ox*z-(cx-r.left);w.scrollTop=oy*z-(cy-r.top)};
  const save=()=>{try{localStorage.setItem('gzoom',String(GZOOM))}catch(e){}};
  w.addEventListener('touchstart',e=>{if(e.touches.length===2){st={d:dist(e.touches),z:GZOOM};e.preventDefault()}},{passive:false});
  w.addEventListener('touchmove',e=>{if(st&&e.touches.length===2){e.preventDefault();const cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2;setZ(st.z*dist(e.touches)/st.d,cx,cy)}},{passive:false});
  w.addEventListener('touchend',e=>{if(st&&e.touches.length<2){st=null;save()}});
  w.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();setZ(GZOOM*(e.deltaY<0?1.08:1/1.08),e.clientX,e.clientY);clearTimeout(w._zt);w._zt=setTimeout(save,300)},{passive:false});
}

  if(!v)return null;const [h,m]=v.split(':').map(Number);return `${h<12?'오전':'오후'} ${h%12||12}:${pad(m)}`}
function krWrap(inp){if(inp._kr||inp.closest('.dwrap')||inp.classList.contains('nokr'))return;inp._kr=1;const cs=getComputedStyle(inp);const w=document.createElement('span');w.className='krw';
  w.style.flex=cs.flexGrow!=='0'?cs.flex:'none';if(cs.flexGrow==='0'&&inp.offsetWidth)w.style.width=inp.offsetWidth+'px';
  inp.parentNode.insertBefore(w,inp);w.appendChild(inp);const o=document.createElement('span');o.className='krv';w.appendChild(o);inp.style.width='100%';inp.style.flex='1';
  const up=()=>{const f=krFmt(inp);o.textContent=f||(inp.getAttribute('aria-label')||(inp.type==='date'?'날짜':'시각'));o.classList.toggle('ph',!f)};inp._krUp=up;inp.addEventListener('input',up);inp.addEventListener('change',up);up()}
function krScan(){document.querySelectorAll('input[type=date],input[type=time]').forEach(i=>{if(!i._kr)krWrap(i);else if(i._krUp)i._krUp()})}
try{new MutationObserver(()=>{clearTimeout(window._krT);window._krT=setTimeout(krScan,30)}).observe(document.body,{childList:true,subtree:true});setInterval(krScan,700)}catch(e){}

/* 구글 캘린더로 내보내기 (.ics) */
function icsExport(){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//seongjangnote//KO','CALSCALE:GREGORIAN','X-WR-CALNAME:성장노트','X-WR-TIMEZONE:Asia/Seoul',
  'BEGIN:VTIMEZONE','TZID:Asia/Seoul','BEGIN:STANDARD','DTSTART:19700101T000000','TZOFFSETFROM:+0900','TZOFFSETTO:+0900','TZNAME:KST','END:STANDARD','END:VTIMEZONE'];
  const esI=x=>String(x).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const dt=(d,hm)=>d.replace(/-/g,'')+(hm?'T'+hm.replace(':','').padStart(4,'0')+'00':'');
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');let n=0;
  const BY=['SU','MO','TU','WE','TH','FR','SA'];
  const ev=(uid,d,str,cat,rrule)=>{let x=String(str);const mt=x.match(/^(\d{1,2}):(\d{2})\s*/);let st=null;if(mt){st=pad(+mt[1])+':'+mt[2];x=x.slice(mt[0].length)}
    let en=null;const me=x.match(/\s*~\s*(\d{1,2}):(\d{2})/);if(me){en=pad(+me[1])+':'+me[2];x=x.replace(me[0],'')}
    let loc='';const pi=x.indexOf('📍');if(pi>=0){loc=x.slice(pi+2).trim();x=x.slice(0,pi).trim()}
    const sum=`[${cat}] ${actStrip(x).trim()||'일정'}`;
    L.push('BEGIN:VEVENT','UID:'+uid+'@seongjangnote','DTSTAMP:'+stamp);
    if(st){L.push('DTSTART;TZID=Asia/Seoul:'+dt(d,st));const e2=en&&hmM(en)>hmM(st)?en:mHM(Math.min(hmM(st)+60,23*60+59));L.push('DTEND;TZID=Asia/Seoul:'+dt(d,e2))}
    else{L.push('DTSTART;VALUE=DATE:'+dt(d),'DTEND;VALUE=DATE:'+dt(addDays(d,1)))}
    L.push('SUMMARY:'+esI(sum));if(loc)L.push('LOCATION:'+esI(loc));if(rrule)L.push(rrule);L.push('END:VEVENT');n++};
  const from=addDays(today(),-31);
  for(const [key,cat] of [['school','학교'],['personal','유진']]){const M=S[key]||{};Object.keys(M).sort().forEach(d=>{if(d<from)return;(M[d]||[]).forEach((v,i)=>ev(`${key}-${d}-${i}`,d,v,cat))})}
  (S.repeat||[]).forEach((r,i)=>{let rule,start;if(r.rr){const q=r.rr,a=r.a||today();start=a;const f={d:'DAILY',w:'WEEKLY',m:'MONTHLY',y:'YEARLY'}[q.f];rule='RRULE:FREQ='+f+';INTERVAL='+(q.n||1);
      if(q.f==='w')rule+=';BYDAY='+(q.wd&&q.wd.length?q.wd:[wday(a)]).map(w=>BY[w]).join(',');
      if(q.f==='m'&&q.mb==='nth'){const dd=+a.slice(8);rule+=';BYDAY='+Math.ceil(dd/7)+BY[wday(a)]}
      if(q.end==='until'&&q.until)rule+=';UNTIL='+dt(q.until)+'T235959';else if(q.end==='count'&&q.cnt)rule+=';COUNT='+q.cnt}
    else{start=today();for(let k=0;k<7;k++){const d=addDays(today(),k);if((r.wd||[]).includes(wday(d))){start=d;break}}rule='RRULE:FREQ=WEEKLY;BYDAY='+(r.wd||[]).map(w=>BY[w]).join(',')}
    const ex=Object.keys(S.rskip||{}).filter(k=>k.endsWith('|'+r.text)).map(k=>k.split('|')[0]);
    ev('rep-'+i,start,r.text,'유진',rule+(ex.length?'\r\nEXDATE;VALUE=DATE:'+ex.map(d=>dt(d)).join(','):''))});
  L.push('END:VCALENDAR');return {text:L.join('\r\n'),n}}
async function icsSave(){if(!DL){toast('이 화면에서는 내려받을 수 없어요');return}const r=icsExport();if(!r.n){toast('내보낼 일정이 없어요');return}
  try{await DL.save({filename:`성장노트_일정_${today()}.ics`,data:r.text});toast(`일정 ${r.n}개를 내보냈어요 · 구글 캘린더 설정 → 가져오기에서 올리세요`)}catch(e){if(!(e&&e.code==='declined'))toast('내려받지 못했어요')}}

function fKcalSum(e){return (e.items||[]).reduce((a,x)=>a+(+x.kcal||0),0)}
function fFreq(){const cnt={},last={};Object.keys(S.food||{}).sort().forEach(d=>(S.food[d]||[]).forEach(e=>(e.items||[]).forEach(x=>{const n=String(x.n||'').trim();if(!n)return;cnt[n]=(cnt[n]||0)+1;last[n]=d+(e.t||'')})));

function fKnown(n){n=String(n).trim();if((S.kmemo||{})[n]!=null)return +S.kmemo[n];let v=null;Object.values(S.food||{}).forEach(l=>(l||[]).forEach(e=>(e.items||[]).forEach(x=>{if(String(x.n).trim()===n&&x.kcal!=null&&x.kcal!=='')v=+x.kcal})));return v}
async function fAI(names){const sm=await getSample();if(!sm||!sm.json||!names.length)return null;
  const prompt=`한국 사람이 먹은 음식·음료를 한 줄씩 적었습니다. 각 줄에 적힌 양(없으면 한국에서 흔한 1회 제공량)을 기준으로 칼로리(kcal)를 정수로 추정하세요. 브랜드 제품은 그 제품의 일반적인 1개 기준으로 계산하세요. 약·영양제는 0.
${names.map((n,i)=>`${i+1}. ${n}`).join('\n')}
JSON으로만 답하세요: {"kcal":[숫자, ...]} (줄 순서대로, ${names.length}개)`;
  try{const r=await sm.json(prompt,{modelTier:'quick',cache:true});const a=r&&Array.isArray(r.kcal)?r.kcal:null;return a&&a.length===names.length?a.map(x=>Math.max(0,Math.round(+x||0))):null}
  catch(e){if(e&&e.code==='not_granted')SAMPLE=null;return null}}
async function fFill(d,id){const e=((S.food||{})[d]||[]).find(x=>x.id===id);if(!e||e.k==='med')return;const miss=(e.items||[]).filter(x=>x.kcal==null||x.kcal==='');if(!miss.length)return;

function foodLane(d){const L=foodOf(d);let lastB=-1;
  const bl=L.map(e=>{const m=fMin(e.t);if(m==null)return '';let top=(Math.min(Math.max(m,TL0*60),TL1*60-20)-TL0*60)/60*TLH;if(top<lastB+2)top=lastB+2;const k=fkI(e.k);const n=(e.items||[]).map(x=>x.n).join(', ');const kc=e.k==='med'?'':fKcalSum(e);const h=22;lastB=top+h;

function foodPanel(t){const L=foodOf(t);const tot={};let all=0;L.forEach(e=>{if(e.k==='med')return;const s=fKcalSum(e);tot[e.k]=(tot[e.k]||0)+s;all+=s});

function qaParse(raw){let t=' '+String(raw||'').replace(/\s+/g,' ').trim()+' ';const T=today();let d='',tm='',m;const WDK='일월화수목금토';

 --event:#4A5B73;--event-soft:#F1F4F9;--none:#A0AEC0;--none-soft:#F4F6FA;--today:#25466F;
 --k1:#B45A1E;--k2:#2E7D5B;--k3:#2F5FA8;--k4:#6B4FA8;--k1s:#FCEFE4;--k2s:#E7F4EE;--k3s:#E8EFFA;--k4s:#F0ECF8;
 --pe:#F8EEF1;--pe-fg:#9A5A68;--tbw:#FFFFFF;
 --gn-sh1:0 1px 2px rgba(32,50,75,.05),0 4px 14px rgba(32,50,75,.06);--gn-sh2:0 2px 4px rgba(32,50,75,.06),0 10px 28px rgba(32,50,75,.10);
 --f-body:"Pretendard","Pretendard Variable","IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-display:var(--f-body)}
html body{background:#F6F8FC!important;color:#20324B;font-family:var(--f-body)}
html body h1,html body h2,html body h3{color:#20324B;letter-spacing:-.01em}
html body .sub{color:#718096}
html body .todaybox,html body .todaybox:not(.otherday),html body .tbpin,html body .tbpin:not(.otherday),html body .wcard,html body .card,html body .gwrap,html body .set section,html body .memov .mcard,html body .tlbox{background:#FFFFFF!important;border:1px solid #E5EAF1!important;border-radius:16px!important;box-shadow:var(--gn-sh1)!important}
html body .btn,html body .ibtn,html body .savebtn,html body .seg>button,html body .tabsub>button,html body .cfbtns>button,html body .mcats button{background:linear-gradient(180deg,#FFFFFF 0%,#F7F9FC 100%);border:1px solid #E5EAF1;color:#20324B;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 1px 2px rgba(32,50,75,.06);transition:transform .16s ease,box-shadow .16s ease,background-color .16s ease,border-color .16s ease}
html body .btn:hover,html body .ibtn:hover,html body .savebtn:hover{transform:translateY(-1px);box-shadow:0 1px 0 #fff inset,0 4px 10px rgba(32,50,75,.10);border-color:#D5DEEA}
html body .btn:active,html body .ibtn:active,html body .savebtn:active,html body .seg>button:active{transform:translateY(1px);box-shadow:0 1px 1px rgba(32,50,75,.08) inset}
html body .btn.primary,html body button.primary,html body [aria-pressed="true"]:not(.sw):not(.psw):not(.gpki),html body [aria-selected="true"]{background:linear-gradient(180deg,#2E5585 0%,#25466F 100%)!important;color:#fff!important;border-color:#25466F!important;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 3px 8px rgba(37,70,111,.25)!important}
html body .btn.danger{color:#B83A3A;border-color:#F0D0D0}

html body textarea.din{min-height:auto}
html body .din:focus{outline:none;border-color:#8EA8C9;box-shadow:0 0 0 3px #EAF1FB}
html body .chip{border:1px solid transparent!important;font-weight:600}
html body .chip::before{display:none!important}
html body .chip.k0{background:#FCEFE4!important;color:#B45A1E!important}
html body .chip.k1{background:#E7F4EE!important;color:#2E7D5B!important}
html body .chip.k2{background:#E8EFFA!important;color:#2F5FA8!important}
html body .chip.k3{background:#F0ECF8!important;color:#6B4FA8!important}
html body .grid{border-collapse:separate;border-spacing:0}

html body .grid th.gd{background:#FBFCFE}
html body .grid tr.gtoday th.gd{background:#EAF1FB;color:#25466F}
html body .grid tfoot td,html body .grid tfoot th{background:#F7F9FC;font-weight:700}
html body .grid td.g-event:not(.gcol){background:#F1F4F9}
html body .grid td.g-none:not(.gcol){background:#F7F8FA;color:#A0AEC0}
html body .overlay{background:rgba(20,30,48,.32);backdrop-filter:blur(2px)}
html body .dlg{border-radius:18px!important;box-shadow:var(--gn-sh2)!important;border:1px solid #E5EAF1;max-height:min(88vh,900px);overflow:auto;background:#fff}

html body input[type=checkbox]{accent-color:#25466F;width:18px;height:18px}

html body #rail .rgrp[data-gk^="today"]{--gc:#315F9C}
html body #rail .rgrp[data-gk^="sched"]{--gc:#2B8C72}
html body #rail .rgrp[data-gk^="guide"]{--gc:#7662B5}
html body #rail .rgrp[data-gk^="todo"]{--gc:#BE7739}
html body #rail .rgrp[data-gk^="set"]{--gc:#61738C}
html body #rail .rbtn{border-radius:10px;transition:background-color .16s ease,box-shadow .16s ease,transform .16s ease;color:#20324B}
html body #rail .rbtn:hover{background:#F2F6FC}
html body #rail .rhead .rl{font-weight:700;font-size:14px}
html body #rail .rsub .rl{font-weight:500;font-size:13px;color:#4A5B73}
html body #rail .ri,html body #rail [data-svg]{color:var(--gc,#61738C)!important}

html body #rail .rsub [data-svg] svg{width:17px;height:17px}
html body #rail [aria-current="page"]{background:#EAF1FB!important;color:#20324B!important;box-shadow:0 1px 0 #fff inset,0 2px 6px rgba(37,70,111,.10);position:relative}
html body #rail [aria-current="page"]::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--gc,#25466F)}
html body #rail .rsep{height:1px;background:#EEF2F7;margin:6px 8px}
html body .savebtn[data-k=ok]{border-color:#BFD9C9}
html body .savebtn[data-k=err]{background:linear-gradient(180deg,#FFF6F6,#FDECEC);border-color:#E8B4B4}
html body .guide .gtile{border-radius:16px!important;box-shadow:var(--gn-sh1)}
html body .guide .gtile>.gtl.gtl.gtl,html body .guide .gsh{background:linear-gradient(180deg,#2E5585,#25466F)!important}
html body .guide .gtile[data-gk="inf"]>.gtl.gtl.gtl,html body .guide .ginfo .gsh{background:linear-gradient(180deg,#8667C4,#7662B5)!important}
html body .mcats button[aria-pressed=true]{background:linear-gradient(180deg,#2E5585,#25466F)!important;color:#fff}
@media (prefers-reduced-motion:reduce){html body *{transition:none!important}}
